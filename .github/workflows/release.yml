name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, v0.9.0)"
        required: true
        default: "v0.9.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP and Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_url: ${{ steps.publish.outputs.url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine and validate version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:MANUAL_VERSION
          } else {
            $env:TAG_NAME
          }
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid version '$version'. Use a version such as v0.9.0."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "number=$($version.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Ensure manual release does not already exist
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:VERSION 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$env:VERSION' already exists."
          }
          $global:LASTEXITCODE = 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows application
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $project = 'src/DoweLanCaster.Windows/DoweLanCaster.Windows.csproj'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'release-build'
          dotnet restore $project --runtime win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish $project `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$env:RELEASE_VERSION `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'START-HERE.txt' $publishDir -Force
          Set-Content (Join-Path $publishDir 'VERSION') $env:RELEASE_VERSION
          $rokuPackage = 'dist/DoweLanCaster-Roku.zip'
          if (Test-Path $rokuPackage) {
            Copy-Item $rokuPackage $publishDir -Force
          }

      - name: Create portable ZIP
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          $zip = Join-Path $assetsDir "Dowe-LanCaster-$env:VERSION-Windows-x64.zip"
          Compress-Archive -Path 'release-build/*' -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Locate or install Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler was not found after installation.'
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer EXE
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
          ISCC: ${{ steps.inno.outputs.compiler }}
        run: |
          & $env:ISCC "/DMyAppVersion=$env:VERSION" 'installer/DoweLanCaster.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $env:GITHUB_WORKSPACE "release-assets/Dowe-LanCaster-v$env:VERSION-Setup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created at $installer"
          }
          "exe=$installer" >> $env:GITHUB_OUTPUT

      - name: Preserve build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Dowe-LanCaster-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.exe }}

      - name: Create release with ZIP, installer, and generated notes
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dowe LanCaster ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.installer.outputs.exe }}
  update-wiki:
    name: Update release wiki
    needs: release
    uses: ./.github/workflows/update-wiki.yml
    with:
      version: ${{ needs.release.outputs.version }}
      release_url: ${{ needs.release.outputs.release_url }}
    secrets: inherit
