name: Build and publish release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="$TAG_NAME"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'; use a version such as v1.2.3."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure manual release does not already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release '$VERSION' already exists."
            exit 1
          fi

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        if: hashFiles('**/*.csproj', '**/*.fsproj', '**/*.sln') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Java
        if: hashFiles('pom.xml', 'build.gradle', 'build.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || 'gradle' }}

      - name: Build project
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm ci
            npm run build --if-present
          elif find . -maxdepth 4 \( -name '*.sln' -o -name '*.csproj' -o -name '*.fsproj' \) -print -quit | grep -q .; then
            dotnet restore
            dotnet publish --configuration Release --no-restore \
              -p:Version="$RELEASE_VERSION" \
              --output "$GITHUB_WORKSPACE/release-build"
          elif [[ -f pom.xml ]]; then
            mvn --batch-mode -Drevision="$RELEASE_VERSION" package
          elif [[ -f gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [[ -f build.gradle || -f build.gradle.kts ]]; then
            gradle build
          else
            echo "No supported build manifest found; packaging the source tree."
          fi

      - name: Package release file
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/Dowe-LanCaster-$VERSION"
          mkdir -p "$STAGE"
          if [[ -d release-build ]]; then
            cp -R release-build/. "$STAGE/"
          elif [[ -d dist ]]; then
            cp -R dist/. "$STAGE/"
          elif [[ -d build/libs ]]; then
            cp -R build/libs/. "$STAGE/"
          elif compgen -G "target/*.jar" >/dev/null; then
            cp target/*.jar "$STAGE/"
          elif [[ -d build ]]; then
            cp -R build/. "$STAGE/"
          else
            git archive --format=tar HEAD | tar -x -C "$STAGE"
          fi
          printf '%s\n' "$VERSION" > "$STAGE/VERSION"
          ASSET="$GITHUB_WORKSPACE/Dowe-LanCaster-$VERSION.zip"
          (cd "$RUNNER_TEMP" && zip -qr "$ASSET" "Dowe-LanCaster-$VERSION")
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create release and generate release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dowe LanCaster ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.asset }}
